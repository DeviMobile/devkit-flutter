  analyzer: ^14.7.0
  analyzer_plugin: ^0.14.20
  yaml: ^3.1.0

dev_dependencies:
  analyzer_testing: ^0.4.5
  devimobile_devkit_lints: ^0.1.0
  test: ^1.25.0
