name: devimobile_devkit_rules
description: Analyzer plugin for Flutter apps that reports hard-coded colors, spacing and UI strings, so design tokens and localization stay the only source.
version: 0.1.2
repository: https://github.com/DeviMobile/devkit-flutter/tree/main/packages/devimobile_devkit_rules
issue_tracker: https://github.com/DeviMobile/devkit-flutter/issues
